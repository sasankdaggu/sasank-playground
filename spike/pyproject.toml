[project]
name = "wand-spike"
version = "0.0.1"
description = "Phase 1 Schema Validation Spike — disposable"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "playwright>=1.44",
  "playwright-stealth>=1.0.6",
  "python-dotenv>=1.0",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "tenacity>=8.3",
  "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-playwright>=0.5",
  "ruff>=0.4",
  "mypy>=1.10",
  "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["spike"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spike"]

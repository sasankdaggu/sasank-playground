[project]
name = "wand-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "python-dotenv>=1.0",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.3",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "httpx>=0.27",
  "structlog>=24.1",
  "google-auth>=2.29",
  "resend>=2.0",
  "boto3>=1.42.95",
  "pillow>=12.2.0",
  "numpy>=2.4.4",
  "scipy>=1.17.1",
  # Scraper
  "playwright>=1.44",
  "playwright-stealth>=1.0.6",
  "tenacity>=8.3",
  "anthropic>=0.97.0",
  "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.4",
  "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "scraper"]
